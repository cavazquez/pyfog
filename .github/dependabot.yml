version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 1 12 *"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 1 12 *"
      timezone: "America/Argentina/Buenos_Aires"
    groups:
      github-actions:
        patterns: ["*"]
