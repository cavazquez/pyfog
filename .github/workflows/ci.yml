name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check . --output-format=github
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Type checking
        run: uv run mypy
      - name: Agent shell checks
        run: make agent-check
      - name: PXE profile checks
        run: make pxe-check
      - name: Image manifest checks
        run: make image-manifest-check
      - name: Secure Boot policy checks
        run: make secure-boot-policy-check
      - name: Release metadata
        run: make release-check
      - name: Tests
        run: uv run pytest -q
      - name: Coverage
        run: |
          uv run pytest --cov=pyfog --cov=scripts --cov-report=term-missing --cov-report=xml
          uv run coverage report --include='pyfog/*' --fail-under=70
          uv run coverage report --include='scripts/*' --fail-under=40
      - name: Migration consistency
        env:
          PYFOG_DATABASE_URL: sqlite:////tmp/pyfog-ci.db
        run: |
          uv run python -m pyfog init-db
          uv run alembic check

  compatibility-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install QCOW2 tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-utils
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Compatibility fixture matrix
        run: make compatibility-check

  secure-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Secure Boot tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbsigntool osslsigncode shim-signed ovmf qemu-system-x86 qemu-utils cloud-image-utils file gdisk socat
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Authenticode signatures and negative cases
        run: make secure-boot-artifact-check
      - name: Secure firmware discovery
        run: ./lab/pyfog-lab --secure-boot doctor

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Dependency vulnerabilities
        run: uv run pip-audit --local --strict --progress-spinner off
      - name: Tracked-source secrets
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --no-verify # pragma: allowlist secret

  windows-inventory:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Windows inventory fixtures
        run: uv run pytest tests/test_platform_inventory.py tests/test_windows_agent.py -q
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "agent/windows/pyfog-agent.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
