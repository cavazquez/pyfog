name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Type checking
        run: uv run mypy
      - name: Agent shell checks
        run: make agent-check
      - name: PXE profile checks
        run: make pxe-check
      - name: Image manifest checks
        run: make image-manifest-check
      - name: Tests
        run: uv run pytest -q
      - name: Migration consistency
        env:
          PYFOG_DATABASE_URL: sqlite:////tmp/pyfog-ci.db
        run: |
          uv run python -m pyfog init-db
          uv run alembic check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Dependency vulnerabilities
        run: uv run pip-audit --local --strict --progress-spinner off
      - name: Tracked-source secrets
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --no-verify # pragma: allowlist secret
