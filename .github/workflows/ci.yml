name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check . --output-format=github
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Type checking
        run: uv run mypy
      - name: Agent shell checks
        run: make agent-check
      - name: PXE profile checks
        run: make pxe-check
      - name: Image manifest checks
        run: make image-manifest-check
      - name: Secure Boot policy checks
        run: make secure-boot-policy-check
      - name: Release metadata
        run: make release-check
      - name: Tests
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 120s \
            uv run pytest -q --durations=20 --durations-min=1.0 \
            --junitxml="pytest-${{ matrix.python }}.xml" 2>&1 | tee "pytest-${{ matrix.python }}.log"
      - name: Coverage
        env:
          PYFOG_JUNIT_XML: pytest-coverage-${{ matrix.python }}.xml
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 180s make test-coverage 2>&1 | \
            tee "coverage-${{ matrix.python }}.log"
      - name: Test timing summary
        if: always()
        run: |
          {
            echo "## Test timing (Python ${{ matrix.python }})"
            echo
            echo "Tests taking at least 1 second are reported below."
            echo
            echo '```text'
            if [ -f "pytest-${{ matrix.python }}.log" ]; then
              awk '/slowest [0-9]+ durations/{show=1} show' "pytest-${{ matrix.python }}.log"
            else
              echo "No se generó el log de pytest."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage and test timing artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-observability-python-${{ matrix.python }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            coverage.xml
            pytest-${{ matrix.python }}.log
            pytest-${{ matrix.python }}.xml
            coverage-${{ matrix.python }}.log
            pytest-coverage-${{ matrix.python }}.xml
      - name: Migration consistency
        env:
          PYFOG_DATABASE_URL: sqlite:////tmp/pyfog-ci.db
        run: |
          timeout --signal=TERM --kill-after=10s 60s uv run python -m pyfog init-db
          timeout --signal=TERM --kill-after=10s 60s uv run alembic check

  compatibility-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install QCOW2 tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-utils
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Compatibility fixture matrix
        run: make compatibility-check

  secure-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Secure Boot tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbsigntool osslsigncode shim-signed ovmf qemu-system-x86 qemu-utils cloud-image-utils file gdisk socat
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Authenticode signatures and negative cases
        run: make secure-boot-artifact-check
      - name: Secure firmware discovery
        run: ./lab/pyfog-lab --secure-boot doctor

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Dependency vulnerabilities
        run: uv run pip-audit --local --strict --progress-spinner off
      - name: Tracked-source secrets
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --no-verify # pragma: allowlist secret

  windows-inventory:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Windows inventory fixtures
        run: uv run pytest tests/test_platform_inventory.py tests/test_windows_agent.py -q
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "agent/windows/pyfog-agent.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
