name: pyfog-dev

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uvicorn", "pyfog.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      PYFOG_ENV: development
      PYFOG_DEBUG: "true"
      PYFOG_DATABASE_URL: sqlite:////var/lib/pyfog/pyfog.db
      PYFOG_IMAGE_STORE: /var/lib/pyfog/images
      PYFOG_ALLOWED_HOSTS: localhost,127.0.0.1
      PYFOG_SECRET_KEY: ${PYFOG_DEV_SECRET_KEY:-pyfog-development-only-session-key-change-me}
    ports:
      - "${PYFOG_DEV_BIND:-127.0.0.1}:${PYFOG_DEV_PORT:-8000}:8000"
    volumes:
      - pyfog_dev_data:/var/lib/pyfog
      - ../pyfog:/app/pyfog
      - ../scripts:/app/scripts
      - ../migrations:/app/migrations
      - ../alembic.ini:/app/alembic.ini:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health/ready').status == 200"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    profiles: ["admin"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "pyfog", "init-db"]
    environment:
      PYFOG_ENV: development
      PYFOG_DEBUG: "true"
      PYFOG_DATABASE_URL: sqlite:////var/lib/pyfog/pyfog.db
      PYFOG_IMAGE_STORE: /var/lib/pyfog/images
      PYFOG_ALLOWED_HOSTS: localhost,127.0.0.1
      PYFOG_SECRET_KEY: ${PYFOG_DEV_SECRET_KEY:-pyfog-development-only-session-key-change-me}
    volumes:
      - pyfog_dev_data:/var/lib/pyfog
    read_only: true
    tmpfs:
      - /tmp

volumes:
  pyfog_dev_data:
